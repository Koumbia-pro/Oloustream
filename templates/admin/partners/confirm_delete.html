{% extends "admin/admin_base.html" %}

{% block title %}Supprimer {{ partner.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="ol-card danger-zone mt-4">
            <div class="ol-card-body text-center p-5">
                <div class="ol-empty-icon" style="background: var(--ol-danger-50); color: var(--ol-danger)"><i class="fa-regular fa-trash-can"></i></div>
                <h1 class="h4">Supprimer la référence « {{ partner.name }} » ?</h1>
                <p class="text-muted">Cette action est définitive. Le logo ne sera plus affiché sur le site public.</p>
                <form method="post" class="d-flex justify-content-center gap-2 mt-4">
                    {% csrf_token %}
                    <a href="{% url 'dashboard:partners_detail' partner.id %}" class="btn btn-light">Annuler</a>
                    <button type="submit" class="btn btn-danger"><i class="fa-regular fa-trash-can"></i> Supprimer définitivement</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
