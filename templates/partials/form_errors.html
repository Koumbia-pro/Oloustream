{% if form.non_field_errors %}
<div class="alert alert-danger d-flex gap-2" role="alert">
    <i class="fa-solid fa-circle-exclamation mt-1"></i>
    <div>{% for error in form.non_field_errors %}<div>{{ error }}</div>{% endfor %}</div>
</div>
{% elif form.errors %}
<div class="alert alert-danger d-flex gap-2" role="alert">
    <i class="fa-solid fa-circle-exclamation mt-1"></i>
    <div>Merci de corriger les champs signalés ci-dessous.</div>
</div>
{% endif %}
