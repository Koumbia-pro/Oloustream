{% extends "base.html" %}

{% block title %}Mot de passe modifié — Oloustream{% endblock %}

{% block content %}
<section class="section section-alt">
    <div class="container">
        <div class="auth-card mx-auto">
            <div class="ol-card ol-card-body p-4 p-md-5 text-center">
                <div class="feature-icon mx-auto"><i class="fa-solid fa-circle-check"></i></div>
                <h1>Mot de passe modifié</h1>
                <p class="sub mb-4">Votre nouveau mot de passe est enregistré. Vous pouvez dès maintenant vous connecter.</p>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-lg w-100">Se connecter <i class="fa-solid fa-arrow-right"></i></a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
