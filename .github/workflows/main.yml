name: Tests et déploiement O2Switch

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Vérifications et tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dépendances système (MySQL client)
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Dépendances Python
        run: pip install -r requirements-prod.txt

      - name: Vérifications Django
        env:
          DJANGO_DEBUG: "True"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Vérifications de sécurité (configuration production)
        env:
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: ci-only-${{ github.sha }}-ci-only-key-with-enough-length-and-entropy
        run: python manage.py check --deploy --fail-level ERROR

      - name: Tests automatisés
        env:
          DJANGO_DEBUG: "True"
        run: python manage.py test apps

  deploy:
    name: Déployer via FTP
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Déployer sur O2Switch
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./
          server-dir: /oloustream/
          exclude: |
            **/.git*
            **/.git*/**
            **/venv/**
            **/env/**
            **/__pycache__/**
            **/*.pyc
            **/db.sqlite3
            **/.env
            **/staticfiles/**
            **/media/**
            **/.github/**
            **/logs/**
            **/.cache/**
            arborescence.txt
